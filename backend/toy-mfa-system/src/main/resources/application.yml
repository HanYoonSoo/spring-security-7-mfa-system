spring:
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100
        query.in_clause_parameter_padding: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  datasource:
    url: ${MFA_DB_URL:jdbc:mysql://localhost:30200/mfa?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${MFA_DB_USERNAME:mfa}
    password: ${MFA_DB_PASSWORD:mfa}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${MFA_MAIL_HOST:}
    port: ${MFA_MAIL_PORT:}
    username: ${MFA_MAIL_USERNAME:}
    password: ${MFA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      auth-code-expiration-millis: 1800000

redis:
  host: ${MFA_REDIS_HOST:localhost}
  port: ${MFA_REDIS_PORT:30300}
  password: ${MFA_REDIS_PASSWORD:password}
